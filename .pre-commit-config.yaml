# Pre-commit hooks — install with `pre-commit install`.
# Run all hooks locally: `pre-commit run --all-files`
#
# Hooks:
#   ruff           — lint + auto-fix
#   ruff-format    — formatter (like black)
#   detect-secrets — scans staged diffs for credentials; blocks commits like the
#                    deleted debug_sftp.py that shipped real passwords.
#   end-of-file    — POSIX file termination & trailing whitespace hygiene.
#   mypy           — opt-in (too slow for every commit; CI runs it on every PR):
#                    pre-commit run mypy --hook-stage manual

repos:
  # ruff and detect-secrets come from uv.lock (the dev group), so the hooks run
  # the very versions CI and Dependabot track instead of a second pin that
  # drifts (language: system, like mypy below).
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: detect-secrets
        name: detect-secrets
        entry: uv run detect-secrets-hook --baseline .secrets.baseline
        language: system
        exclude: ^(data/|logs/|\.secrets\.baseline$)

  # Pinned by commit, a tag can move: bump with `pre-commit autoupdate --freeze`
  # and put the allowlist pragma back (detect-secrets reads the hash as a secret).
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0 # pragma: allowlist secret
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict

  # Runs the project-venv mypy (language: system) so results match CI — the
  # mirrors-mypy hook resolves types in an isolated env without the project's
  # dependencies and reports different errors.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (manual stage)
        entry: uv run mypy src features
        language: system
        types: [python]
        pass_filenames: false
        stages: [manual]

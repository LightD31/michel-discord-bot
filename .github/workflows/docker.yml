name: Docker image

# Called by ci.yml, never run on its own (S17): on a pull request the image is
# built and scanned with a read-only token; on a push to master or a version tag
# it is published only once every CI job has passed, so a red build never
# reaches `:latest` or `:master`. The caller job grants the token's scopes:
# this workflow declares none, so a pull request never gets `packages: write`.
on:
  workflow_call:
    inputs:
      publish:
        description: Push the image to GHCR (with provenance and SBOM)
        type: boolean
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # Build once into the local Docker daemon so the image can be scanned
      # before anything is pushed; the build-and-push step below reuses the
      # layers from the same builder's cache.
      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: michel-discord-bot:scan
          cache-from: type=gha
          # The local Docker image store can't hold attestations; the published
          # build below still carries provenance and the SBOM.
          provenance: false
          sbom: false

      # pip-audit covers the Python pins; this also covers the Debian packages
      # of the base image. Only issues with a released fix are listed: those
      # are the ones a base-image digest bump (or a dependency bump) resolves.
      - name: Scan image (fixable HIGH and CRITICAL, report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: michel-discord-bot:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          # Outside the workspace: the build context is the workspace, and the
          # report or the vulnerability database must never end up in the image.
          output: ${{ runner.temp }}/trivy-report.txt
          cache-dir: ${{ runner.temp }}/trivy-cache
          exit-code: "0"

      - name: Image scan summary
        if: always()
        run: |
          {
            echo "## Image scan (fixable HIGH/CRITICAL)"
            echo '```'
            cat "$RUNNER_TEMP/trivy-report.txt" 2>/dev/null || echo "No report produced."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The gate: a fixable CRITICAL fails the build (and blocks publishing).
      # Resolve it by bumping the base image digest or the affected dependency;
      # for an accepted risk, list the CVE in a .trivyignore with a reason.
      - name: Fail on fixable CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: michel-discord-bot:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          cache-dir: ${{ runner.temp }}/trivy-cache
          skip-setup-trivy: true

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ inputs.publish }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

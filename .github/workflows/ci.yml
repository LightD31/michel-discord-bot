name: CI

on:
  pull_request:
  push:
    branches: [master, main]
  # Weekly run so pip-audit keeps catching new CVEs against the lockfile even
  # when nothing is pushed (scheduled runs execute on the default branch).
  # Only the audit job runs on it: everything else is pinned and can't change.
  schedule:
    - cron: "0 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs only need to read the repo. Anything that would write
# (push, comment, release) must opt in explicitly at the job level.
permissions:
  contents: read

env:
  # The interpreter the bot ships on — keep in sync with the Dockerfile base
  # image. uv installs it when the runner doesn't have it.
  UV_PYTHON: "3.14"
  # Every uv command asserts uv.lock matches pyproject.toml instead of quietly
  # re-locking, so a stale lock fails whichever job runs first.
  UV_LOCKED: "1"
  # Keep in step with the uv stage in the Dockerfile.
  UV_TOOL_VERSION: "0.13.6"

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_TOOL_VERSION }}
          enable-cache: true

      - name: Install locked runtime deps + dev tools
        run: uv sync

      - name: Ruff lint
        # GitHub output format turns findings into inline PR annotations.
        run: uv run ruff check --output-format=github .

      - name: Ruff format (check only)
        run: uv run ruff format --check .

  typecheck:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_TOOL_VERSION }}
          enable-cache: true

      - name: Install locked runtime deps + dev tools
        run: uv sync

      - name: Mypy (src/core strict; rest lenient)
        # features/ is the framework-free layer the architecture sets aside for
        # testable domain logic — exactly where annotations pay off most.
        run: uv run mypy src features

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_TOOL_VERSION }}
          enable-cache: true

      - name: Install locked runtime deps + dev tools
        run: uv sync

      - name: Pytest with coverage
        run: uv run pytest --cov=src --cov=features --cov-report=term --cov-report=xml

      - name: Coverage summary
        # Render the per-file table into the run's summary page so coverage is
        # visible per run without downloading the artifact or a third-party
        # uploader (skip_covered in pyproject.toml keeps the table short).
        if: always()
        run: |
          {
            echo "## Coverage"
            echo ""
            uv run coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  lockfile:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_TOOL_VERSION }}

      - name: Check uv.lock is in sync with pyproject.toml
        # The other jobs fail on a stale lock too (UV_LOCKED); this one says so
        # by name. New upstream releases never fail it, only real drift does.
        run: |
          if ! uv lock --check; then
            echo "::error::uv.lock is out of sync with pyproject.toml — regenerate with: uv lock"
            exit 1
          fi

  config-example:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_TOOL_VERSION }}
          enable-cache: true

      - name: Install locked runtime deps
        run: uv sync --no-dev

      - name: Check config.example.json matches the Web UI schemas
        # Mirrors the lockfile job: the generated example is committed, so a
        # schema change that forgets to regenerate it must fail here rather
        # than leave operators with an example missing the new keys. The
        # generator exits non-zero if an extension fails to import, which
        # would otherwise silently drop that module's section.
        run: |
          # Several extensions read config/config.json at import time, and the
          # generator has to import them all to collect their schemas. The
          # committed example is a valid seed: the output is built from the
          # schema registry, not from this file.
          mkdir -p config && cp config.example.json config/config.json
          uv run --no-dev python scripts/generate_config_example.py
          if ! git diff --exit-code -- config.example.json; then
            echo "::error::config.example.json is out of date — regenerate with: python scripts/generate_config_example.py"
            exit 1
          fi

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_TOOL_VERSION }}
          enable-cache: true

      - name: Audit locked runtime dependencies for known CVEs
        # pip-audit can't read uv.lock, so audit its export: every runtime pin
        # (the image's contents), checked as-is with --no-deps. pip-audit
        # itself comes from the locked dev group.
        run: |
          uv export --no-dev --no-hashes --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uv run --only-dev pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip

  secrets:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_TOOL_VERSION }}
          enable-cache: true

      - name: Install detect-secrets (locked dev tools only)
        run: uv sync --only-dev

      - name: Scan tracked files against baseline
        # `detect-secrets-hook` is the CI-friendly entry point: it compares
        # findings against the baseline and exits non-zero on new secrets.
        # `scan --baseline` only rewrites the baseline and cannot fail a build.
        # Exclusions mirror .pre-commit-config.yaml (data dumps and logs
        # contain non-secret UUIDs that trigger false positives).
        run: |
          git ls-files -z ':!data/**' ':!logs/**' ':!.secrets.baseline' \
            | xargs -0 uv run --only-dev detect-secrets-hook --baseline .secrets.baseline

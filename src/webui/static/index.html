<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michel Bot — Dashboard</title>
    <link rel="stylesheet" href="/static/app.css">
</head>
<body>
    <div id="app"></div>
    <div class="toast-container" id="toasts" role="status" aria-live="polite"></div>

    <!-- Editor Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
            <div class="modal-header">
                <h3 id="modal-title">Éditer la configuration</h3>
                <button class="btn btn-ghost btn-sm" data-click="closeModal" aria-label="Fermer" title="Fermer">✕</button>
            </div>
            <div class="modal-body">
                <textarea class="json-editor" id="json-editor" spellcheck="false"></textarea>
                <div class="json-error" id="json-error"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" data-click="closeModal">Annuler</button>
                <button class="btn btn-success" id="modal-save-btn" data-click="saveModal">💾 Sauvegarder</button>
            </div>
        </div>
    </div>

    <!-- The app's own confirmation: askConfirm() in js/ui/confirm.js, never the browser's confirm(). -->
    <div class="modal-overlay" id="confirm-overlay">
        <div class="modal modal-confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message" tabindex="-1">
            <div class="modal-header">
                <h3 id="confirm-title">Confirmer</h3>
            </div>
            <div class="modal-body">
                <p id="confirm-message" class="confirm-message"></p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" id="confirm-cancel" data-click="settleConfirm" data-click-args="[false]">Annuler</button>
                <button class="btn btn-primary" id="confirm-ok" data-click="settleConfirm" data-click-args="[true]">Confirmer</button>
            </div>
        </div>
    </div>

    <script type="module" src="/static/js/main.js"></script>
</body>
</html>

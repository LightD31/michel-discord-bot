[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "michel-discord-bot"
version = "0.1.0"
description = "Michel — modular multi-guild Discord bot (interactions.py + MongoDB + optional FastAPI dashboard)."
requires-python = ">=3.12"
license = { file = "LICENSE" }
readme = "README.md"

# Runtime dependencies, declared as ranges. Exact versions live in uv.lock,
# which the Docker image and CI install from (`uv sync --locked`). Run `uv lock`
# whenever this list changes — CI fails if the two drift apart.
dependencies = [
    # Bot framework & core
    "discord-py-interactions",
    "aiohttp",
    "curl_cffi",
    "uvloop; platform_system != 'Windows'",
    # Datastore
    # MongoDB driver, native async API (AsyncMongoClient, src/core/db.py)
    "pymongo>=4.13",
    "pydantic>=2",
    # Integrations
    "spotipy",
    "twitchAPI",
    "notion-client>=2.7.0",
    "openai",
    "mcstatus",
    "asyncssh",
    "nbtlib==2.0.4",
    "pyfactorybridge",
    "ldap3>=2.9.1",
    # Utilities
    # IANA time zone database for zoneinfo (src/core/clock.py): the slim image has none.
    "tzdata",
    "python-dateutil",
    "babel",
    "isodate",
    "emoji",
    "defusedxml",
    "Pillow",
    "prettytable>=3.12",
    # Monitoring
    "prometheus-client",
    # Optional error reporting to Sentry / GlitchTip (config.errorReporting)
    "sentry-sdk>=2.73,<3",
    # Optional Web UI
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",
]

# The project ships as a flat collection of modules (main.py + extensions/ +
# features/ + src/) loaded at runtime from /app, not as an installable library.
# `py-modules = []` tells setuptools to build an empty distribution so
# `pip install .` only resolves and installs the declared dependencies.
[tool.setuptools]
py-modules = []

# Development tooling. Locked in uv.lock like the runtime deps, so CI lints and
# type-checks with the same tool versions as every contributor; `uv sync`
# installs this group by default and the Docker image leaves it out (--no-dev).
[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "detect-secrets>=1.5",
    "pre-commit>=3.7",
    "pip-audit>=2.7",
    # The dashboard's browser smoke test (tests/test_spa_smoke.py).
    "playwright>=1.50",
]

# An application, not a library: uv installs the dependencies only and never
# builds or installs the project itself.
[tool.uv]
package = false

# ─── ruff ──────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "extensions/_*",  # archived/disabled extensions
    "data",
    "logs",
]

[tool.ruff.lint]
# Start permissive — this is a large legacy codebase. Tighten over time.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long — handled by formatter
    "B008",  # function-call-in-default-argument (common interactions.py pattern)
    "B023",  # function-uses-loop-variable (triggers too many false positives in event handlers)
    "SIM108", # ternary-in-if (not always clearer)
]

[tool.ruff.lint.per-file-ignores]
"extensions/*.py" = ["F401"]  # extensions may re-export without using

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── mypy ──────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
# `src/` has no __init__.py and imports across the codebase use the
# `src.core.*` form. Without these two settings mypy sees each module under
# two names (e.g. `core.logging` and `src.core.logging`) and bails out.
explicit_package_bases = true
mypy_path = "$MYPY_CONFIG_FILE_DIR"
# Incremental adoption: strict on new core modules, lenient everywhere else.
# Raise the floor as modules get typed.
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
exclude = [
    "^extensions/_",
    "^data/",
    "^logs/",
]

# `strict = true` inside [[tool.mypy.overrides]] expands at config-load time
# and its flags leak globally instead of scoping to the matched module
# (known mypy quirk). Listing the flags explicitly scopes them correctly.
[[tool.mypy.overrides]]
module = "src.core.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
warn_return_any = true

# The framework-free domain layer and the shared infrastructure: function
# bodies are checked even where they aren't annotated yet.
[[tool.mypy.overrides]]
module = ["features.*", "src.*"]
check_untyped_defs = true

# extensions/ is checked too (CI: `mypy src features extensions`), every module
# of it: a mixin declares what it uses from its extension class or a sibling
# (class-level annotations, `if TYPE_CHECKING:` stubs; a package with several
# mixins keeps them in its `_base.py`, as extensions/zevent/_base.py). No
# override may set `ignore_errors` again: tests/test_mypy_exclusions.py fails.

# ─── pytest ────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# The project ships as a flat namespace (extensions/ + features/ + src/) — no
# package install. Pytest needs the repo root on sys.path so test modules can
# import from those packages without setting PYTHONPATH at every invocation.
pythonpath = ["."]
asyncio_mode = "auto"
# Repository tests against a real server: skipped unless MONGO_TEST_URL is set
# (see tests/conftest.py). CI's test job provides one.
markers = [
    "mongo: needs a MongoDB server (MONGO_TEST_URL)",
    "browser: drives the dashboard in Chromium (skipped without one)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",  # third-party libs
]

# ─── coverage ──────────────────────────────────────────────────────────
[tool.coverage.run]
# features/ is the deliberately unit-testable layer; extensions/ is tested
# through tests/discord_fakes.py; scripts/ holds the restore the runbook relies
# on. `pytest --cov` measures all four.
source = ["src", "features", "extensions", "scripts"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Floor for `pytest --cov` over src, features, extensions and scripts: 69.9%
# without MongoDB and 73% with it (CI) when this was last raised (P12, D3). CI's
# test job also holds src + features alone at 81% (81.2% / 87%), so tests added
# for the extensions can't hide a drop there. Keep both below the figures
# without MongoDB so a local run passes too, and raise them as tests are added.
fail_under = 69

# ─── detect-secrets ────────────────────────────────────────────────────
# Baseline lives at .secrets.baseline; configured via .pre-commit-config.yaml.
